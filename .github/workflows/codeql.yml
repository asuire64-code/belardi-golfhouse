# Analyse de sécurité du code JavaScript (y compris les scripts intégrés aux pages)
# et des workflows GitHub eux-mêmes, par l'outil CodeQL de GitHub.
name: CodeQL

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "23 6 * * 1" # chaque lundi : détecte aussi les failles découvertes après coup
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyse:
    name: CodeQL (${{ matrix.langage }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        langage: [javascript-typescript, actions]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: ${{ matrix.langage }}
          queries: security-extended
          config: |
            paths-ignore:
              - tests/node_modules
      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
