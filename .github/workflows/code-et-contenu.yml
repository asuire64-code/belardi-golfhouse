name: Code et contenu

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  verifier:
    name: Code et contenu
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Valider le HTML (pages publiées uniquement)
        run: npm run valider:html

      - name: Vérifier les liens internes
        run: npm run valider:liens
