name: Sécurité

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  verifier:
    name: Sécurité
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Recherche de secrets (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Revue des dépendances
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Vérifier les vulnérabilités connues (npm audit)
        run: npm audit --audit-level=high

      - name: Vérifier .well-known/security.txt
        run: node .github/scripts/check-security-txt.js
