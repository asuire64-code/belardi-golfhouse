# Portique qualité : chaque modification proposée (pull request) doit passer ces contrôles
# avant de pouvoir être fusionnée dans main, donc publiée sur belardi-golfhouse.fr.
name: Contrôle qualité

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qualite-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: tests

jobs:
  code:
    name: Code et contenu
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tests/package-lock.json
      - run: npm ci
      - name: HTML, CSS, JavaScript, SEO, liens, traductions, sécurité du code
        run: npm run test:rapide
      - name: Le registre de dette ne peut que baisser
        if: github.ref != 'refs/heads/main'
        run: |
          if git show origin/main:tests/dette-connue.json > "$RUNNER_TEMP/dette-main.json" 2>/dev/null; then
            node outils/dette-ne-monte-pas.js "$RUNNER_TEMP/dette-main.json"
          else
            echo "Installation initiale des garde-fous : registre créé."
          fi
      - name: Les garde-fous eux-mêmes n'ont pas été affaiblis
        if: github.ref != 'refs/heads/main'
        run: node outils/garde-fous-intacts.js

  version-playwright:
    name: Version de Playwright
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: tests/package.json
      - id: v
        run: echo "version=$(node -p 'require("./package.json").devDependencies["@playwright/test"]')" >> "$GITHUB_OUTPUT"

  navigateurs:
    name: Navigateurs (affichage, fonctionnement, accessibilité)
    needs: version-playwright
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Image officielle : mêmes navigateurs et mêmes polices système à chaque exécution,
    # condition indispensable pour comparer les captures au pixel près.
    container:
      image: mcr.microsoft.com/playwright:v${{ needs.version-playwright.outputs.version }}-noble
    env:
      HOME: /root
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tests/package-lock.json
      - run: npm ci
      - name: Chrome, Firefox, Safari, Android, iPhone
        run: npx playwright test
      - name: Rapport (captures avant/après en cas d'échec)
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rapport-navigateurs
          path: tests/resultats/
          retention-days: 14

  performance:
    name: Performance (Lighthouse)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: treosh/lighthouse-ci-action@3e7e23fb74242897f95c0ba9cabad3d0227b9b18 # v12
        with:
          configPath: ./tests/lighthouserc.json
          uploadArtifacts: true
          temporaryPublicStorage: false

  securite:
    name: Sécurité
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Aucun mot de passe ni clé secrète dans le code (historique complet)
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: false
      - name: Aucune dépendance vulnérable ajoutée
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Outils de test sans faille connue
        run: npm audit --audit-level=moderate
