name: Navigateurs

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  tester:
    name: Navigateurs (affichage, fonctionnement, accessibilité)
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Installer les navigateurs Playwright
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Lancer les tests (Chromium, Firefox, WebKit)
        run: npx playwright test

      - name: Publier le rapport en cas d'échec
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: rapport-playwright
          path: playwright-report/
          retention-days: 7
